services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ucbl-room-viewer
    ports:
      - "8888:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

